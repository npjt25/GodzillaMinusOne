plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Minecraft 1.20.1 ships Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            // GeckoLib uses mixins; these let them work in the dev environment.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            // ./gradlew runClient -Pshots: the in-game checks and screenshots of client/harness/ShotsHarness (CI's
            // "client" job, on a virtual display); without -Pshots the client starts as usual.
            if (project.hasProperty('shots')) {
                property 'godzillaminusone.shots', 'true'
                property 'forge.logging.console.level', 'info'
                property 'forge.logging.markers', ''
                args '--width', '1280', '--height', '720'
            }
        }

        server {
            args '--nogui'
        }

        // Runs the server-side game tests in src/main/java/.../gametest and exits.
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
            property 'forge.logging.console.level', 'info'
        }
    }
}

repositories {
    // only for -Pshapes (below): Walkers, CraftedCore and ReMorphed from Modrinth's Maven
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex('software\\.bernie.*')
            includeGroup('com.eliotlash.mclib')
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}")

    // ./gradlew runClient -Pshots -Pshapes: the in-game checks with the real Walkers and ReMorphed (and CraftedCore,
    // which they need) in the game, to play as Godzilla and the Odo Island Monster (CI's "client-shapes" job). Only
    // in the development game: nothing of theirs is built into the mod, which looks them up by name if installed.
    if (project.hasProperty('shapes')) {
        // (Modrinth version ids, given by CI: -Pwalkers_version=... -Premorphed_version=... -Pcraftedcore_version=...)
        runtimeOnly fg.deobf("maven.modrinth:${findProperty('craftedcore_project') ?: 'craftedcore'}:${findProperty('craftedcore_version')}")
        runtimeOnly fg.deobf("maven.modrinth:woodwalkers:${findProperty('walkers_version')}")
        runtimeOnly fg.deobf("maven.modrinth:remorphed:${findProperty('remorphed_version')}")
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range, geckolib_version: geckolib_version,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
