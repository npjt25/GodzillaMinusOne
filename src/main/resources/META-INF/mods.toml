modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
credits="Original Bedrock add-on, Godzilla's model, textures, animations, effects and sounds by GojiDraw. The Odo Island Monster is Monster122's Godzillasaurus (model, skins and animations) from the G-1 Bedrock add-on. The atomic blast's mushroom cloud is built from Alex's Caves' cloud textures and layered rendering (AlexModGuy, GNU LGPL), after the Ginza blast in Godzilla Minus One."
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="geckolib"
    mandatory=true
    versionRange="[4.4,)"
    ordering="AFTER"
    side="BOTH"
