name: Build mod jar

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      - name: Game tests
        shell: bash
        run: |
          ./gradlew runGameTestServer --no-daemon 2>&1 | tee gametest.log
          grep -E "GAME TESTS COMPLETE|required tests|Running test|failed|atomic breath test" gametest.log | grep -v "Exception" || true

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: godzillaminusone-jar
          path: build/libs/*.jar
          if-no-files-found: error
        if: always()
